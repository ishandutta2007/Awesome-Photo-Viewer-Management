<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <linearGradient id="accentPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Dynamic Animated Elements in Background */
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(15px) rotate(-4deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }

    .floating-card-1 { animation: float1 6s ease-in-out infinite; }
    .floating-card-2 { animation: float2 8s ease-in-out infinite; }
    .pulse-bg { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
    .animated-stream { stroke-dasharray: 8 8; animation: dashMove 2s linear infinite; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Dynamic Background Glowing Orbs -->
  <circle cx="150" cy="90" r="180" fill="#06b6d4" opacity="0.15" filter="url(#glow)" class="pulse-bg" />
  <circle cx="1050" cy="270" r="220" fill="#8b5cf6" opacity="0.18" filter="url(#glow)" class="pulse-bg" />

  <!-- Dynamic Animated Graph & Flow Background Elements (Kept safely on right side & lower layer) -->
  <g class="floating-card-2" transform="translate(820, 40)">
    <!-- Decorative Image Gallery Cards in Background -->
    <rect x="60" y="20" width="220" height="140" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" filter="url(#shadow)" />
    <circle cx="110" cy="65" r="18" fill="#f43f5e" opacity="0.8" />
    <polygon points="80,130 130,80 170,120 200,95 250,130" fill="#3b82f6" opacity="0.5" />
    <polygon points="120,130 170,90 220,130" fill="#06b6d4" opacity="0.6" />
    
    <rect x="0" y="80" width="240" height="160" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" filter="url(#shadow)" />
    <!-- Image Aperture Icon inside background card -->
    <circle cx="120" cy="150" r="32" fill="none" stroke="url(#accentCyan)" stroke-width="4" opacity="0.8" />
    <path d="M120 118 L135 138 M148 135 L138 158 M142 172 L120 168 M102 165 L112 142 M108 128 L128 140" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Animated Connecting Flow Lines -->
  <path d="M 450 280 Q 650 340 850 250" fill="none" stroke="url(#accentCyan)" stroke-width="2" class="animated-stream" opacity="0.4" />
  <path d="M 500 300 Q 700 220 920 290" fill="none" stroke="url(#accentPink)" stroke-width="2" class="animated-stream" opacity="0.4" />

  <!-- Dynamic Metric Floating Pills in Background -->
  <g class="floating-card-1" transform="translate(720, 220)">
    <rect x="0" y="0" width="160" height="42" rx="21" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)" />
    <text x="24" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#c084fc">⚡ 500+ Formats</text>
  </g>
  
  <g class="floating-card-2" transform="translate(910, 240)">
    <rect x="0" y="0" width="170" height="42" rx="21" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)" />
    <text x="22" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">🤖 AI Management</text>
  </g>

  <!-- Foreground Content Container (Guaranteed Clear & Visible) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="290" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="16" y="21" class="badge-text">📸 AWESOME PHOTO ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" class="title" filter="url(#shadow)">
      Photo Viewer &amp; Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="205" class="subtitle">
      Curated Commercial SaaS Platforms &amp; Open-Source Image Solutions
    </text>

    <!-- Feature Highlights / Badges -->
    <g transform="translate(0, 245)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="140" height="36" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="16" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🖼️ Image Browsing</text>

      <!-- Item 2 -->
      <rect x="152" y="0" width="146" height="36" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="168" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🗂️ Library DAM</text>

      <!-- Item 3 -->
      <rect x="310" y="0" width="150" height="36" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="326" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">⚙️ RAW Processing</text>
      
      <!-- Item 4 -->
      <rect x="472" y="0" width="135" height="36" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="488" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🌟 Self-Hosted AI</text>
    </g>
  </g>
</svg>
